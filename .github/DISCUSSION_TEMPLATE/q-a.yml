title: "[Q]: "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you are trying to do and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Commands, the relevant part of `.t12/project.json`, and the output or refusal.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `bin/t12 --version`.
